<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-container">
    <h1>AI Study Assistant</h1>
    <div id="chatbox" class="chatbox"></div>
    <div class="input-area">
        <input type="text" id="question" placeholder="Ask a study question..." autocomplete="off">
        <button onclick="askAI()">Send</button>
    </div>
    <!-- Lecture Notes Summarizer -->
    <div class="notes-container">
    <h2>Lecture Notes Summarizer</h2>
    <textarea id="notes" placeholder="Paste your lecture notes here..."></textarea>
    <button onclick="summarizeNotes()">Summarize</button>
    <div id="summary" class="summary"></div>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
